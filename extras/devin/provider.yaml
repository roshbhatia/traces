# yaml-language-server: $schema=../../schema/provider.schema.json
version: provider/v1
name: devin
description: Read Devin CLI session activity and directory sessions
command: [traces-provider-devin]
defaults:
  timeout: 2m
  priority: 100
actions:
  provider.validate:
    description: Check the Devin CLI state directory inside the provider runtime
    argv: [--action, validate]
  activity.read:
    description: Read activity inside a time and session window
    argv:
      - --since
      - "{{ .Since }}"
      - "{{ if .ExactSession }}--exact-session{{ else }}--session{{ end }}"
      - "{{ .Session }}"
      - --directory
      - "{{ .Directory }}"
    env:
      TRACES_DIRECTORY: "{{ .Directory }}"
      TRACES_SESSION: "{{ .Session }}"
  session.current:
    description: Read the most recent Devin conversation for a workspace directory
    argv: [--action, current, --directory, "{{ .Directory }}"]
  session.discover:
    description: Find recent Devin conversations bound to a workspace directory
    argv: [--action, discover, --directory, "{{ .Directory }}"]
requires:
  commands: [sqlite3]
