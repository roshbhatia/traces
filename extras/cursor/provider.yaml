# yaml-language-server: $schema=../../schema/provider.schema.json
version: provider/v1
name: cursor
description: Read Cursor CLI transcript activity and directory sessions
command: [traces-provider-cursor]
defaults:
  timeout: 2m
  priority: 100
actions:
  provider.validate:
    description: Check the projects directory inside the provider runtime
    argv: [--action, validate]
  activity.read:
    description: Read activity inside a time and session window
    argv:
      - --since
      - "{{ .Since }}"
      - "{{ if .ExactSession }}--exact-session{{ else }}--session{{ end }}"
      - "{{ .Session }}"
      - --directory
      - "{{ .Directory }}"
    env:
      TRACES_DIRECTORY: "{{ .Directory }}"
      TRACES_SESSION: "{{ .Session }}"
  session.current:
    description: Read the conversation Cursor exported into this shell
    argv: [--action, current]
  session.discover:
    description: Find recent Cursor conversations bound to a workspace directory
    argv: [--action, discover, --directory, "{{ .Directory }}"]
