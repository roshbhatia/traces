version: 2

builds:
  - id: traces
    main: .
    binary: traces
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-full-core
    main: .
    binary: .traces-core
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-full-launcher
    main: ./cmd/traces-full
    binary: traces
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-claude
    main: ./extras/claude
    binary: traces-provider-claude
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-codex
    main: ./extras/codex
    binary: traces-provider-codex
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-opencode
    main: ./extras/opencode
    binary: traces-provider-opencode
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-git
    main: ./extras/git
    binary: traces-provider-git
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-desktop
    main: ./extras/desktop
    binary: traces-provider-desktop
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-gate
    main: ./extras/gate
    binary: traces-provider-gate
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-antigravity
    main: ./extras/antigravity
    binary: traces-provider-antigravity
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-cursor
    main: ./extras/cursor
    binary: traces-provider-cursor
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]
  - id: traces-provider-devin
    main: ./extras/devin
    binary: traces-provider-devin
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [darwin_arm64, linux_amd64, linux_arm64]

archives:
  - id: core
    ids: [traces]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: completions/*
        dst: completions
      - src: schema/*.cue
        dst: schema
      - src: schema/*.json
        dst: schema
  - id: full
    ids:
      - traces-full-core
      - traces-full-launcher
      - traces-provider-antigravity
      - traces-provider-claude
      - traces-provider-codex
      - traces-provider-cursor
      - traces-provider-devin
      - traces-provider-desktop
      - traces-provider-gate
      - traces-provider-git
      - traces-provider-opencode
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_full_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: completions/*
        dst: completions
      - src: schema/*.cue
        dst: schema
      - src: schema/*.json
        dst: schema
      - src: extras/antigravity/provider.yaml
        dst: share/traces/providers/antigravity/provider.yaml
      - src: extras/claude/provider.yaml
        dst: share/traces/providers/claude/provider.yaml
      - src: extras/codex/provider.yaml
        dst: share/traces/providers/codex/provider.yaml
      - src: extras/cursor/provider.yaml
        dst: share/traces/providers/cursor/provider.yaml
      - src: extras/devin/provider.yaml
        dst: share/traces/providers/devin/provider.yaml
      - src: extras/desktop/provider.yaml
        dst: share/traces/providers/desktop/provider.yaml
      - src: extras/gate/provider.yaml
        dst: share/traces/providers/gate/provider.yaml
      - src: extras/git/provider.yaml
        dst: share/traces/providers/git/provider.yaml
      - src: extras/opencode/provider.yaml
        dst: share/traces/providers/opencode/provider.yaml
  - id: provider-antigravity
    ids: [traces-provider-antigravity]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_antigravity_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/antigravity/provider.yaml
        dst: share/traces/providers/antigravity/provider.yaml
  - id: provider-claude
    ids: [traces-provider-claude]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_claude_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/claude/provider.yaml
        dst: share/traces/providers/claude/provider.yaml
  - id: provider-codex
    ids: [traces-provider-codex]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_codex_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/codex/provider.yaml
        dst: share/traces/providers/codex/provider.yaml
  - id: provider-cursor
    ids: [traces-provider-cursor]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_cursor_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/cursor/provider.yaml
        dst: share/traces/providers/cursor/provider.yaml
  - id: provider-devin
    ids: [traces-provider-devin]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_devin_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/devin/provider.yaml
        dst: share/traces/providers/devin/provider.yaml
  - id: provider-desktop
    ids: [traces-provider-desktop]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/desktop/provider.yaml
        dst: share/traces/providers/desktop/provider.yaml
  - id: provider-gate
    ids: [traces-provider-gate]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_gate_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/gate/provider.yaml
        dst: share/traces/providers/gate/provider.yaml
  - id: provider-git
    ids: [traces-provider-git]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_git_{{ .Version }}_{{ .Os }}_{{ .Arch }}
