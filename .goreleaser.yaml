version: 2

builds:
  - id: traces
    main: .
    binary: traces
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-full-core
    main: .
    binary: .traces-core
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-full-launcher
    main: ./cmd/traces-full
    binary: traces
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-provider-claude
    main: ./extras/claude
    binary: traces-provider-claude
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-provider-codex
    main: ./extras/codex
    binary: traces-provider-codex
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-provider-opencode
    main: ./extras/opencode
    binary: traces-provider-opencode
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-provider-git
    main: ./extras/git
    binary: traces-provider-git
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: traces-provider-desktop
    main: ./extras/desktop
    binary: traces-provider-desktop
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: core
    ids: [traces]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: completions/*
        dst: completions
      - src: schema/*.cue
        dst: schema
      - src: schema/*.json
        dst: schema
  - id: full
    ids:
      - traces-full-core
      - traces-full-launcher
      - traces-provider-claude
      - traces-provider-codex
      - traces-provider-desktop
      - traces-provider-git
      - traces-provider-opencode
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_full_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: completions/*
        dst: completions
      - src: schema/*.cue
        dst: schema
      - src: schema/*.json
        dst: schema
      - src: extras/claude/provider.yaml
        dst: share/traces/providers/claude/provider.yaml
      - src: extras/codex/provider.yaml
        dst: share/traces/providers/codex/provider.yaml
      - src: extras/desktop/provider.yaml
        dst: share/traces/providers/desktop/provider.yaml
      - src: extras/git/provider.yaml
        dst: share/traces/providers/git/provider.yaml
      - src: extras/opencode/provider.yaml
        dst: share/traces/providers/opencode/provider.yaml
  - id: provider-claude
    ids: [traces-provider-claude]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_claude_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/claude/provider.yaml
        dst: share/traces/providers/claude/provider.yaml
  - id: provider-codex
    ids: [traces-provider-codex]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_codex_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/codex/provider.yaml
        dst: share/traces/providers/codex/provider.yaml
  - id: provider-desktop
    ids: [traces-provider-desktop]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/desktop/provider.yaml
        dst: share/traces/providers/desktop/provider.yaml
  - id: provider-git
    ids: [traces-provider-git]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_git_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/git/provider.yaml
        dst: share/traces/providers/git/provider.yaml
  - id: provider-opencode
    ids: [traces-provider-opencode]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_provider_opencode_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: extras/opencode/provider.yaml
        dst: share/traces/providers/opencode/provider.yaml

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
